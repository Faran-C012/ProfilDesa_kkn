          content: `
              <a href="index.html#blog" class="back-button">

              <div class="article-header">
                  <h1 class="article-title">Promosi Bimbel Gratis untuk Anak Desa Pangebatan</h1>
                  <div class="article-meta">
                      <span><i class="far fa-calendar"></i> 26-27 Januari 2026</span>
                      <span><i class="far fa-user"></i> Divisi Pendidikan KKN Kelompok 37</span>

              <img src="img/blog_1.jpg" alt="Sosialisasi Bimbel" class="article-featured-image">

              <div class="article-content">
                  <p>Pendidikan merupakan salah satu aspek penting dalam membentuk generasi yang cerdas, berkarakter, dan berakhlak baik. Sebagai bentuk kepedulian terhadap dunia pendidikan, Mahasiswa Kuliah Kerja Nyata (KKN) Universitas Peradaban Kelompok 37 Desa Pangebatan melaksanakan program kerja bimbingan belajar (bimbel) gratis bagi siswa Sekolah Dasar (SD) dan Madrasah Ibtidaiyah (MI).</p>

                  <h2>Sosialisasi di Sekolah</h2>
                  <p>Kegiatan ini diawali dengan sosialisasi dan promosi bimbingan belajar gratis yang dilaksanakan pada hari Senin, 26 Januari 2026 di SD Negeri Pangebatan 2. Selanjutnya, pada hari Selasa, 27 Januari 2026, kegiatan sosialisasi juga dilakukan di MI Miftahul Fatihin. Sosialisasi ini bertujuan untuk memperkenalkan program bimbel kepada pihak sekolah serta siswa agar dapat mengikuti kegiatan secara optimal.</p>

                    <p>Program pemberdayaan ekonomi masyarakat di RT 07 RW 07.</p>
                    <a href="article.html?id=11" class="btn-read-more">Baca Artikel</a>
                </div>
            </div>
        </div>
    </div>
  `,
        },
      };

      // Fungsi untuk mendapatkan parameter ID dari URL
      function getArticleId() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");
        return id || "1"; // Default ke artikel pertama jika tidak ada parameter
      }

      // Fungsi untuk memuat artikel berdasarkan ID
      function loadArticle() {
        const articleId = getArticleId();
        const article = articles[articleId];
        const container = document.getElementById("article-container");

        if (article) {
          // Tampilkan artikel
          container.innerHTML = article.content;

          // Update judul halaman
          document.title = article.title + " - Desa Pangebatan";

          // Update meta description
          const metaDescription = document.querySelector('meta[name="description"]');
          if (metaDescription) {
            metaDescription.setAttribute("content", article.title + " - " + article.date);
          }

          // Setup share buttons
          setupShareButtons(article.title, articleId);

          // Setup smooth scrolling for internal links
          setupSmoothScrolling();
        } else {
          // Jika artikel tidak ditemukan
          container.innerHTML = `
                          <div class="article-not-found">
                              <h2>Artikel Tidak Ditemukan</h2>
                              <p>Maaf, artikel yang Anda cari tidak tersedia.</p>
                              <a href="index.html#blog" class="back-button">
                                  <i class="fas fa-arrow-left"></i> Kembali ke Daftar Artikel
                              </a>
                          </div>
                      `;
        }
      }

      // Fungsi untuk setup tombol share
      function setupShareButtons(articleTitle, articleId) {
        // Tunggu sebentar agar DOM selesai di-render
        setTimeout(() => {
          const currentUrl = window.location.href;
          const encodedUrl = encodeURIComponent(currentUrl);
          const encodedTitle = encodeURIComponent(articleTitle);

          // Setup Facebook share
          const facebookButtons = document.querySelectorAll(".share-facebook");
          facebookButtons.forEach((button) => {
            button.addEventListener("click", function (e) {
              e.preventDefault();
              window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`, "_blank", "width=600,height=400");
            });
          });

          // Setup Twitter share
          const twitterButtons = document.querySelectorAll(".share-twitter");
          twitterButtons.forEach((button) => {
            button.addEventListener("click", function (e) {
              e.preventDefault();
              window.open(`https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`, "_blank", "width=600,height=400");
            });
          });

          // Setup WhatsApp share
          const whatsappButtons = document.querySelectorAll(".share-whatsapp");
          whatsappButtons.forEach((button) => {
            button.addEventListener("click", function (e) {
              e.preventDefault();
              window.open(`https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`, "_blank", "width=600,height=400");
            });
          });

          // Setup LinkedIn share
          const linkedinButtons = document.querySelectorAll(".share-linkedin");
          linkedinButtons.forEach((button) => {
            button.addEventListener("click", function (e) {
              e.preventDefault();
              window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`, "_blank", "width=600,height=400");
            });
          });

          // Setup Telegram share
          const telegramButtons = document.querySelectorAll(".share-telegram");
          telegramButtons.forEach((button) => {
            button.addEventListener("click", function (e) {
              e.preventDefault();
              window.open(`https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`, "_blank", "width=600,height=400");
            });
          });
        }, 100);
      }

      // Fungsi untuk smooth scrolling
      function setupSmoothScrolling() {
        // Smooth scroll untuk anchor links di dalam artikel
        document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
          anchor.addEventListener("click", function (e) {
            e.preventDefault();
            const targetId = this.getAttribute("href");
            if (targetId === "#") return;

            const targetElement = document.querySelector(targetId);
            if (targetElement) {
              window.scrollTo({
                top: targetElement.offsetTop - 80,
                behavior: "smooth",
              });
            }
          });
        });
      }

      // Fungsi untuk menambahkan artikel baru
      function addNewArticle(id, articleData) {
        articles[id] = articleData;
        // Jika perlu, simpan ke localStorage untuk persistensi
        try {
          localStorage.setItem("pangebatan_articles", JSON.stringify(articles));
        } catch (e) {
          console.log("LocalStorage tidak tersedia");
        }
      }

      // Coba load artikel dari localStorage jika ada
      function loadArticlesFromStorage() {
        try {
          const stored = localStorage.getItem("pangebatan_articles");
          if (stored) {
            const storedArticles = JSON.parse(stored);
            // Merge dengan articles default
            Object.assign(articles, storedArticles);
          }
        } catch (e) {
          console.log("Gagal memuat artikel dari localStorage");
        }
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", function () {
        // Load articles from storage first
        loadArticlesFromStorage();

        // Then load the requested article
        loadArticle();

        // Setup mobile navigation toggle
        $("#nav-toggle").on("click", function () {
          $("#main-nav").slideToggle();
        });
      });

      // Fungsi untuk developer/tim: Menampilkan semua artikel yang tersedia
      function showAllArticles() {
        console.log("Artikel yang tersedia:");
        Object.keys(articles).forEach((id) => {
          console.log(`ID: ${id} - ${articles[id].title}`);
        });
      }

      // Untuk debugging, bisa panggil showAllArticles() di console
      window.showAllArticles = showAllArticles;
    </script>
  </body>
</html>
